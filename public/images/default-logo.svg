<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" role="img" aria-label="Logo CBT Sekolah">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b5bdb"/>
      <stop offset="100%" stop-color="#183494"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd43b"/>
      <stop offset="100%" stop-color="#fab005"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Shield/Badge -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#bgGrad)" filter="url(#cardShadow)"/>

  <!-- Subtle Inner Border -->
  <rect x="11" y="11" width="98" height="98" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Mortarboard / Toga Cap Top -->
  <polygon points="60,26 96,43 60,60 24,43" fill="#ffffff"/>
  
  <!-- Mortarboard Cap Skull Outline -->
  <path d="M38 51.5 L38 67 C38 75 60 83 60 83 C60 83 82 75 82 67 L82 51.5 L60 62.5 Z" fill="#e7f5ff"/>

  <!-- Tassel Ribbon & Drop -->
  <path d="M88 46 L88 68" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="88" cy="72" r="3.5" fill="url(#goldGrad)"/>

  <!-- Open Book Base -->
  <path d="M32 92 C42 86 54 87 60 90 C66 87 78 86 88 92 C88 92 78 82 60 85 C42 82 32 92 32 92 Z" fill="#ffffff" fill-opacity="0.95"/>
  <line x1="60" y1="85" x2="60" y2="90" stroke="#183494" stroke-width="1.5"/>
</svg>

